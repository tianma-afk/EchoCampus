  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    restart: always
    ports:
      - "9000:9000"
      - "9090:9090"
    environment:
      MINIO_ACCESS_KEY: echo_campus
      MINIO_SECRET_KEY: echo_campus
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - /home/data:/data
      - /home/config:/root/.minio
    command: server /data --address ":9000" --console-address ":9090"

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO to be ready...';
      until mc alias set local http://minio:9000 echo_campus echo_campus 2>/dev/null; do
        sleep 2;
      done;
      mc mb local/image --ignore-existing;
      echo 'MinIO init done';
      "

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: etcd
    restart: always
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - /data/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-standalone:
    image: milvusdb/milvus:v2.4.17
    container_name: milvus-standalone
    restart: always
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: echo_campus
      MINIO_SECRET_ACCESS_KEY: echo_campus
      COMMON_SECURITY_AUTHORIZATIONENABLED: "false"
    volumes:
      - /data/milvus:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_started
    command: milvus run standalone

  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: echo_campus
      RABBITMQ_DEFAULT_PASS: echo_campus
    ports:
      - "15672:15672"   # 管理界面端口
      - "5672:5672"     # 消息通信端口
    volumes:
      - /usr/local/docker/rabbitmq:/var/lib/rabbitmq

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - /data/redis/data:/data
    command: redis-server --appendonly yes --requirepass echo_campus
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "echo_campus", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: library/postgres:16
    container_name: postgres
    environment:
      POSTGRES_PASSWORD: echo_campus
      POSTGRES_USER: echo_campus
      POSTGRES_DB: echo_campus
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5433:5432"
    restart: always
    volumes:
      - /data/postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echo_campus -d echo_campus"]
      interval: 5s
      timeout: 5s
      retries: 10