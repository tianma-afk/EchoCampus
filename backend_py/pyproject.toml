[project]
name = "backend-py"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
# 为了兼容 torch-directml，将Python版本上限设为3.12
requires-python = ">=3.11, <3.13"
dependencies = [
    "fastapi>=0.136.1",
    "numpy>=2.4.5",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "timm>=1.0.27",
    "uvicorn>=0.47.0",
    "Pillow>=10.0.0",
    "pymilvus>=3.0.0",
    "milvus-lite>=3.0",
    "omegaconf>=2.3.0",
    "minio>=7.2.20",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
]

[project.optional-dependencies]
cpu = ["torch>=2.12.0", "torchvision>=0.27.0"]
cu126 = [
    "torch>=2.12.0; sys_platform == 'win32'",
    "torchvision>=0.27.0; sys_platform == 'win32'",
    "xformers>=0.0.28; sys_platform == 'win32'",
    "triton-windows>=3.7.0; sys_platform == 'win32'",
]
xpu = [
    "torch>=2.12.0; sys_platform == 'win32'",
    "torchvision>=0.27.0; sys_platform == 'win32'",
    "triton-xpu>=3.7.0; sys_platform == 'win32'",
]
directml = [
    "torch-directml; sys_platform == 'win32'",
]
[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "cu126" }],
    [{ extra = "cpu" }, { extra = "directml" }],
    [{ extra = "cpu" }, { extra = "xpu" }],
    [{ extra = "cu126" }, { extra = "directml" }],
    [{ extra = "cu126" }, { extra = "xpu" }],
    [{ extra = "directml" }, { extra = "xpu" }],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-xpu", extra = "xpu" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-xpu", extra = "xpu" },
]
triton-xpu = [
    { index = "pytorch-xpu", extra = "xpu" },
]
