[project]
name = "backend-py"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
# 修改点：为了兼容 torch-directml，将Python版本上限设为3.12
requires-python = ">=3.11, <3.13"
dependencies = [
    "faiss-cpu>=1.13.2",
    "fastapi>=0.136.1",
    "numpy>=2.4.5",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "timm>=1.0.27",
    "uvicorn>=0.47.0",
    "Pillow>=10.0.0",
    "pymilvus>=3.0.0",
    "milvus-lite>=3.0",
    "omegaconf>=2.3.0",
]

[project.optional-dependencies]
cpu = ["torch>=2.12.0", "torchvision>=0.27.0"]
cu126 = ["torch>=2.12.0", "torchvision>=0.27.0", "xformers>=0.0.28"]
# 新增 directml 可选依赖组
directml = [
    "torch-directml",  # 这个包会自动安装对应的 torch 和 torchvision 版本
]

[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "cu126" }],
    [{ extra = "cpu" }, { extra = "directml" }],
    [{ extra = "cu126" }, { extra = "directml" }],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
]