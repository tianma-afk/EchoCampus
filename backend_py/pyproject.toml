[project]
name = "backend-py"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faiss-cpu>=1.13.2",
    "fastapi>=0.136.1",
    "numpy>=2.4.5",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "timm>=1.0.27",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "uvicorn>=0.47.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "timm>=1.0.27",
    "pymilvus>=3.0.0",
    "milvus-lite>=3.0",
    "omegaconf>=2.3.0",
    "xformers>=0.0.35",
]

[project.optional-dependencies]
cpu = ["torch>=2.12.0", "torchvision>=0.27.0"]
cu126 = ["torch>=2.12.0", "torchvision>=0.27.0"]

# 声明 cpu 和 cu126 互斥，让 uv 不会同时解析它们
[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "cu126" }],
]

# 定义索引源
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

# 为不同 extra 组指定不同的 torch 来源
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
]
