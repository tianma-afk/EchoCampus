server:
  port: 8080

spring:
  application:
    name: EchoCampus-Backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:echo_campus}
    username: ${DB_USERNAME:echo_campus}
    password: ${DB_PASSWORD:echo_campus}
    driver-class-name: org.postgresql.Driver
  flyway:
    clean-disabled: false
    clean-on-migrate: true
    validate-on-migrate: false

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.echocampus.entity
  type-handlers-package: com.echocampus.handler
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: none
logging:
  level:
    com.echocampus: INFO

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:echo_campus}
  secret-key: ${MINIO_SECRET_KEY:echo_campus}
  bucket: ${MINIO_BUCKET:image}

