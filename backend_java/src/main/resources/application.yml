server:
  port: 8080

spring:
  application:
    name: EchoCampus-Backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:echo_campus}
    username: ${DB_USERNAME:echo_campus}
    password: ${DB_PASSWORD:echo_campus}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    clean-disabled: true
    clean-on-migrate: false
    validate-on-migrate: false
    locations: classpath:db/migration
  mail:
    host: smtp.qq.com
    port: 587
    username: 3292513488@qq.com
    password: qkaxjkriydildbai
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:echo_campus}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

jwt:
  secret: ${JWT_SECRET:EchoCampus@2024#JWTSecret!Key32bytes}
  expiration: ${JWT_EXPIRATION:604800}

super-admin:
  username: ${SUPER_ADMIN_USERNAME:admin}
  password: ${SUPER_ADMIN_PASSWORD:admin123}
  email: ${SUPER_ADMIN_EMAIL:12345678@qq.com}

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.echocampus
  type-handlers-package: com.echocampus.shared.handler
  configuration:
    map-underscore-to-camel-case: true
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: none
logging:
  level:
    com.echocampus: INFO

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:echo_campus}
  secret-key: ${MINIO_SECRET_KEY:echo_campus}
  bucket: ${MINIO_BUCKET:image}

callback:
  protocol: ${CALLBACK_PROTOCOL:http}
  host: ${CALLBACK_HOST:localhost}
  port: ${CALLBACK_PORT:8080}
  base-path: /api/v1/internal/callback
  # 回调超时时间（毫秒）
  timeout: ${CALLBACK_TIMEOUT:5000}

algorithm:
  client:
    base-url: ${ALGORITHM_CLIENT_BASE_URL:http://localhost:8000}
    insert:
      failure-threshold: ${ALGORITHM_CLIENT_INSERT_FAILURE_THRESHOLD:10}
      timeout-ms: ${ALGORITHM_CLIENT_INSERT_TIMEOUT_MS:60000}
      half-open-max-requests: ${ALGORITHM_CLIENT_INSERT_HALF_OPEN_MAX_REQUESTS:3}
      half-open-success-rate-threshold: ${ALGORITHM_CLIENT_INSERT_HALF_OPEN_SUCCESS_RATE_THRESHOLD:0.5}
    search:
      failure-threshold: ${ALGORITHM_CLIENT_SEARCH_FAILURE_THRESHOLD:5}
      timeout-ms: ${ALGORITHM_CLIENT_SEARCH_TIMEOUT_MS:30000}
      half-open-max-requests: ${ALGORITHM_CLIENT_SEARCH_HALF_OPEN_MAX_REQUESTS:5}
      half-open-success-rate-threshold: ${ALGORITHM_CLIENT_SEARCH_HALF_OPEN_SUCCESS_RATE_THRESHOLD:0.5}
